<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Cartoon-Style Background Blobs -->
    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

   <div class="bubble b1"></div>
   <div class="bubble b2"></div>
   <div class="bubble b3"></div>

    <!-- Main 3D Calculator Container -->
    <div class="calculator-container">
        <div class="calculator-3d">
            <!-- Screen Display -->
            <div class="screen">
                <div class="previous-operand" id="previous-display"></div>
                <div class="current-operand" id="current-display">0</div>
            </div>
            
            <!-- Button Grid -->
            <div class="buttons-grid">
                <button class="btn btn-clear span-two" onclick="clearScreen()">AC</button>
                <button class="btn btn-delete" onclick="deleteNumber()">DEL</button>
                <button class="btn btn-operator" onclick="appendOperator('/')">÷</button>
                
                <button class="btn" onclick="appendNumber('7')">7</button>
                <button class="btn" onclick="appendNumber('8')">8</button>
                <button class="btn" onclick="appendNumber('9')">9</button>
                <button class="btn btn-operator" onclick="appendOperator('*')">×</button>
                
                <button class="btn" onclick="appendNumber('4')">4</button>
                <button class="btn" onclick="appendNumber('5')">5</button>
                <button class="btn" onclick="appendNumber('6')">6</button>
                <button class="btn btn-operator" onclick="appendOperator('-')">-</button>
                
                <button class="btn" onclick="appendNumber('1')">1</button>
                <button class="btn" onclick="appendNumber('2')">2</button>
                <button class="btn" onclick="appendNumber('3')">3</button>
                <button class="btn btn-operator" onclick="appendOperator('+')">+</button>
                
                <button class="btn" onclick="appendNumber('0')">0</button>
                <button class="btn" onclick="appendNumber('.')">.</button>
                <button class="btn btn-equals span-two" onclick="calculate()">=</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

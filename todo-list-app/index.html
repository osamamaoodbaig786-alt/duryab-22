<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App with Local Storage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>projects\todo-list-app\index.html</h1>
        <p class="subtitle">Add your tasks and save them in the browser.</p>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Enter a task">
            <button id="addBtn" class="btn-add">Add Task</button>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <button id="clearBtn" class="btn-clear">Clear All Tasks</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATMOSPHERE — Luxury Weather Experience</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Luxury Color Palette */
            --bg-base: #57759b;
            --panel-bg: rgba(0, 8, 43, 0.7);
            --panel-border: rgba(212, 175, 55, 0.15);
            --panel-border-hover: rgba(212, 175, 55, 0.4);
            
            --text-primary: #ffffff;
            --text-muted: #94a3b8;
            
            --accent-gold: #e2b857;
            --accent-gold-glow: rgba(226, 184, 87, 0.25);
            --accent-gold-soft: rgba(226, 184, 87, 0.08);
            --accent-emerald: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            /* Rich Multi-Layer Ambient Background */
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(226, 184, 87, 0.12) 0%, transparent 55%),
                radial-gradient(circle at 10% 80%, rgba(30, 41, 59, 0.5) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(226, 184, 87, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
        }

        /* Luxury Main Glass Container */
        .app-window {
            width: 100%;
            max-width: 980px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 2.25rem;
            box-shadow: 
                0 40px 80px -15px rgba(0, 0, 0, 0.9),
                0 0 40px rgba(226, 184, 87, 0.05),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.4s ease;
        }

        /* Top Bar */
        .header {
            padding: 1.85rem 2.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            border-bottom: 1px solid var(--panel-border);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
        }

        .location-brand {
            display: flex;
            align-items: center;
            gap: 1.1rem;
        }

        .brand-icon-box {
            width: 3.25rem;
            height: 3.25rem;
            background: linear-gradient(135deg, rgba(226, 184, 87, 0.2) 0%, rgba(0, 0, 0, 0.4) 100%);
            border: 1px solid var(--panel-border);
            border-radius: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .city-name {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .country-tag {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--accent-gold);
            background: var(--accent-gold-soft);
            border: 1px solid rgba(143, 116, 55, 0.3);
            padding: 0.22rem 0.6rem;
            border-radius: 0.5rem;
            text-transform: uppercase;
        }

        /* Search Bar */
        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 340px;
        }

        .search-input {
            width: 100%;
            padding: 0.8rem 1.25rem 0.8rem 2.85rem;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 1.1rem;
            color: var(--text-primary);
            font-size: 0.875rem;
            letter-spacing: 0.02em;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
            background: rgba(6, 8, 14, 0.9);
            box-shadow: 0 0 25px var(--accent-gold-glow);
        }

        .search-icon {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 1rem;
            height: 1rem;
            fill: var(--text-muted);
            transition: fill 0.3s ease;
        }

        .search-input:focus + .search-icon {
            fill: var(--accent-gold);
        }

        /* Unit Switcher */
        .unit-switcher {
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 0.9rem;
            padding: 0.25rem;
            gap: 0.25rem;
        }

        .unit-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.45rem 0.9rem;
            border-radius: 0.65rem;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .unit-btn.active {
            background: linear-gradient(135deg, rgba(107, 88, 42, 0.25) 0%, rgba(226, 184, 87, 0.1) 100%);
            color: var(--accent-gold);
            border: 1px solid rgba(110, 94, 56, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* Presets Horizontal Bar */
        .presets-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1.1rem 2.5rem;
            border-bottom: 1px solid var(--panel-border);
            background: rgba(51, 124, 219, 0.15);
            overflow-x: auto;
        }

        .presets-title {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-right: 0.5rem;
        }

        .preset-chip {
            background: rgba(41, 49, 160, 0.02);
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 0.5rem 1.1rem;
            border-radius: 0.85rem;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .preset-chip:hover {
            background: var(--accent-gold-soft);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            box-shadow: 0 4px 15px rgba(226, 184, 87, 0.12);
            transform: translateY(-1px);
        }

        /* Content Body */
        .content-area {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2.25rem;
        }

        /* Hero Main Temperature Display */
        .hero-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .condition-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.45rem 1rem;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 999px;
            color: var(--accent-emerald);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            margin-bottom: 1.2rem;
        }

        .temp-display-group {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
        }

        .temp-main {
            font-size: 5.75rem;
            font-weight: 300;
            line-height: 0.95;
            letter-spacing: -0.04em;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .unit-symbol {
            font-size: 2.25rem;
            font-weight: 300;
            color: var(--accent-gold);
        }

        .temp-meta {
            margin-top: 1.4rem;
            display: flex;
            align-items: center;
            gap: 1.75rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        .temp-meta strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .hero-icon-container {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(226, 184, 87, 0.15) 0%, transparent 70%);
            filter: drop-shadow(0 0 20px rgba(226, 184, 87, 0.2));
        }

        /* Section Titles */
        .section-header {
            font-size: 0.725rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--accent-gold);
            margin-bottom: 1.1rem;
            opacity: 0.9;
        }

        /* Hourly Scroll Horizontal */
        .hourly-scroll {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 0.75rem;
        }

        .hourly-card {
            min-width: 92px;
            background: rgba(6, 8, 13, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 1.35rem;
            padding: 1.25rem 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .hourly-card:hover {
            border-color: var(--accent-gold);
            background: rgba(226, 184, 87, 0.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transform: translateY(-3px);
        }

        /* Lower Details Grid */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .details-grid {
                grid-template-columns: 1.1fr 1.2fr;
            }
        }

        .glass-card {
            background: rgba(6, 8, 13, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 1.6rem;
            padding: 1.6rem;
        }

        .weekly-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.875rem;
            letter-spacing: 0.02em;
        }

        .weekly-row:last-child {
            border-bottom: none;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .metric-tile {
            background: rgba(6, 8, 13, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 1.35rem;
            padding: 1.35rem 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 125px;
            transition: border-color 0.3s ease;
        }

        .metric-tile:hover {
            border-color: var(--panel-border-hover);
        }

        .metric-value {
            font-size: 1.65rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-top: 0.75rem;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(226, 184, 87, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }
    </style>
</head>
<body>

    <div class="app-window">
        <!-- Header Section -->
        <header class="header">
            <div class="location-brand">
                <div class="brand-icon-box">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e2b857" stroke-width="1.8"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </div>
                <div>
                    <div class="city-name">
                        <span id="cityName">Lahore</span>
                        <span id="countryTag" class="country-tag">PK</span>
                    </div>
                    <div id="liveClock" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.15rem; letter-spacing: 0.05em;">Mon 12:47 PM</div>
                </div>
            </div>

            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="Search city (e.g. London, Tokyo)...">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M21.71 20.29l-5.4-5.39A7.9 7.9 0 0 0 18 10a8 8 0 1 0-8 8 7.9 7.9 0 0 0 4.9-1.69l5.39 5.4a1 1 0 0 0 1.42-1.42zM4 10a6 6 0 1 1 6 6 6 6 0 0 1-6-6z"/></svg>
            </div>

            <div class="unit-switcher">
                <button id="btnCel" class="unit-btn active">°C</button>
                <button id="btnFar" class="unit-btn">°F</button>
            </div>
        </header>

        <!-- Presets Row -->
        <div class="presets-bar">
            <span class="presets-title">Presets:</span>
            <button class="preset-chip" onclick="searchCity('Lahore')">Lahore</button>
            <button class="preset-chip" onclick="searchCity('Tokyo')">Tokyo</button>
            <button class="preset-chip" onclick="searchCity('London')">London</button>
            <button class="preset-chip" onclick="searchCity('Paris')">Paris</button>
            <button class="preset-chip" onclick="searchCity('Dubai')">Dubai</button>
            <button class="preset-chip" onclick="searchCity('New York')">New York</button>
        </div>

        <!-- Main Body -->
        <div class="content-area">
            
            <!-- Hero Section -->
            <div class="hero-section">
                <div>
                    <div class="condition-badge">
                        <span style="width:6px; height:6px; background:var(--accent-emerald); border-radius:50%;"></span>
                        <span id="conditionText">Sunny & Clear</span>
                    </div>
                    <div class="temp-display-group">
                        <span id="tempMain" class="temp-main">34</span>
                        <span id="unitSymbol" class="unit-symbol">°C</span>
                    </div>
                    <div class="temp-meta">
                        <span>High: <strong id="tempHigh">35°</strong></span>
                        <span>Low: <strong id="tempLow">27°</strong></span>
                        <span>Feels like <strong id="tempFeels">40°</strong></span>
                    </div>
                </div>

                <div class="hero-icon-container">
                    <svg id="heroIcon" width="88" height="88" viewBox="0 0 24 24" fill="none" stroke="#e2b857" stroke-width="1.3"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </div>
            </div>

            <!-- Hourly Section -->
            <div>
                <div class="section-header">Hourly Forecast</div>
                <div id="hourlyContainer" class="hourly-scroll"></div>
            </div>

            <!-- Lower Grid Details -->
            <div class="details-grid">
                <!-- 7-Day Panel -->
                <div class="glass-card">
                    <div class="section-header">7-Day Forecast</div>
                    <div id="weeklyContainer"></div>
                </div>

                <!-- Weather Metrics -->
                <div class="metrics-grid">
                    <div class="metric-tile">
                        <div class="section-header" style="margin:0;">Air Quality</div>
                        <div>
                            <div class="metric-value" id="airQualityVal">75</div>
                            <div style="font-size: 0.75rem; color: var(--accent-emerald); font-weight: 600; margin-top: 0.2rem;">Good</div>
                        </div>
                    </div>

                    <div class="metric-tile">
                        <div class="section-header" style="margin:0;">Wind Speed</div>
                        <div class="metric-value"><span id="windSpeedVal">12</span> <span style="font-size: 0.75rem; font-weight: normal; color: var(--text-muted);">km/h</span></div>
                    </div>

                    <div class="metric-tile">
                        <div class="section-header" style="margin:0;">Humidity</div>
                        <div class="metric-value" id="humidityVal">50%</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Script Operations -->
    <script>
        const state = {
            unit: 'C',
            lat: 31.558,
            lon: 74.3507,
            city: 'Lahore',
            country: 'PK',
            rawData: null
        };

        function updateClock() {
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const formattedHours = hours % 12 || 12;
            document.getElementById('liveClock').textContent = `${days[now.getDay()]} ${formattedHours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function searchCity(cityName) {
            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`);
                const geoData = await geoRes.json();
                
                if (geoData.results && geoData.results.length > 0) {
                    const place = geoData.results[0];
                    state.city = place.name;
                    state.country = place.country_code || '';
                    state.lat = place.latitude;
                    state.lon = place.longitude;
                    fetchWeatherData();
                }
            } catch (err) {
                console.error("Geocoding failed:", err);
            }
        }

        async function fetchWeatherData() {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${state.lat}&longitude=${state.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
                const res = await fetch(url);
                state.rawData = await res.json();
                renderUI();
            } catch (err) {
                console.error("Weather data fetch failed:", err);
            }
        }

        function convertTemp(tempC) {
            return state.unit === 'F' ? Math.round((tempC * 9/5) + 32) : Math.round(tempC);
        }

        function renderUI() {
            if (!state.rawData) return;

            const current = state.rawData.current;
            const daily = state.rawData.daily;

            document.getElementById('cityName').textContent = state.city;
            document.getElementById('countryTag').textContent = state.country.toUpperCase();
            
            document.getElementById('tempMain').textContent = convertTemp(current.temperature_2m);
            document.getElementById('unitSymbol').textContent = `°${state.unit}`;
            document.getElementById('tempHigh').textContent = `${convertTemp(daily.temperature_2m_max[0])}°`;
            document.getElementById('tempLow').textContent = `${convertTemp(daily.temperature_2m_min[0])}°`;
            document.getElementById('tempFeels').textContent = `${convertTemp(current.apparent_temperature)}°`;
            
            document.getElementById('humidityVal').textContent = `${current.relative_humidity_2m}%`;
            document.getElementById('windSpeedVal').textContent = Math.round(current.wind_speed_10m);

            // Hourly List
            const hourlyContainer = document.getElementById('hourlyContainer');
            hourlyContainer.innerHTML = '';
            
            const hourlyTemps = state.rawData.hourly.temperature_2m.slice(0, 12);
            const hourlyTimes = state.rawData.hourly.time.slice(0, 12);

            hourlyTemps.forEach((temp, idx) => {
                const dateObj = new Date(hourlyTimes[idx]);
                const timeStr = idx === 0 ? 'Now' : dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                const card = document.createElement('div');
                card.className = 'hourly-card';
                card.innerHTML = `
                    <span style="color: var(--text-muted); font-size: 0.75rem; letter-spacing:0.02em;">${timeStr}</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e2b857" stroke-width="1.8"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M1 12h2M21 12h2"/></svg>
                    <span style="font-weight: 600; font-size: 0.9rem;">${convertTemp(temp)}°</span>
                `;
                hourlyContainer.appendChild(card);
            });

            // Weekly List
            const weeklyContainer = document.getElementById('weeklyContainer');
            weeklyContainer.innerHTML = '';

            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            daily.time.slice(0, 7).forEach((timeStr, idx) => {
                const dateObj = new Date(timeStr);
                const dayLabel = idx === 0 ? 'Today' : days[dateObj.getDay()];

                const row = document.createElement('div');
                row.className = 'weekly-row';
                row.innerHTML = `
                    <span style="width: 70px; font-weight: 500;">${dayLabel}</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e2b857" stroke-width="1.8"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M1 12h2M21 12h2"/></svg>
                    <div>
                        <span style="color: var(--text-muted); font-size: 0.825rem;">${convertTemp(daily.temperature_2m_min[idx])}°</span>
                        <span style="font-weight: 600; margin-left: 0.75rem;">${convertTemp(daily.temperature_2m_max[idx])}°</span>
                    </div>
                `;
                weeklyContainer.appendChild(row);
            });
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                searchCity(e.target.value.trim());
                e.target.value = '';
            }
        });

        document.getElementById('btnCel').addEventListener('click', () => {
            state.unit = 'C';
            document.getElementById('btnCel').classList.add('active');
            document.getElementById('btnFar').classList.remove('active');
            renderUI();
        });

        document.getElementById('btnFar').addEventListener('click', () => {
            state.unit = 'F';
            document.getElementById('btnFar').classList.add('active');
            document.getElementById('btnCel').classList.remove('active');
            renderUI();
        });

        fetchWeatherData();
    </script>
</body>
</html>
